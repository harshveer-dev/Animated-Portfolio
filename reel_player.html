<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harshveer Portfolio - Instagram Reel Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #151828, #070913 80%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .player-card {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(12px);
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 19.5;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
    }
    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Harshveer's 3D Portfolio Reel</h1>
    <p>Cinematic Bottom-to-Top Infinite Loop (~50s)</p>
  </div>

  <div class="player-card">
    <div class="video-wrapper">
      <img src="portfolio_instagram_reel.webp" alt="Harshveer Singh 3D Portfolio Video Walkthrough" id="videoElement">
    </div>
    
    <div class="badge">9:16 Instagram Reel Format (26.4 MB)</div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="restartVideo()">🔄 Restart</button>
      <a class="btn btn-primary" href="portfolio_instagram_reel.webp" download="portfolio_instagram_reel.webp">⬇️ Save Video</a>
    </div>
  </div>

  <script>
    function restartVideo() {
      const img = document.getElementById('videoElement');
      const src = img.src;
      img.src = '';
      setTimeout(() => {
        img.src = src.split('?')[0] + '?t=' + Date.now();
      }, 50);
    }
  </script>
</body>
</html>
